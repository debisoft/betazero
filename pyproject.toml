[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "betazero"
version = "0.1.0"
description = "An SFT-only AI twin of a developer, served to coding agents as MCP tools."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: Apache Software License"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Training pulls a heavy CUDA stack; keep it out of the default install so the
# MCP server and the corpus tooling stay cheap to set up.
train = [
    "torch>=2.4",
    "transformers>=4.45",
    "peft>=0.13",
    "trl>=0.11",
    "datasets>=3.0",
    "accelerate>=1.0",
]
dev = ["ruff>=0.7", "pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/debisoft/betazero"
Issues = "https://github.com/debisoft/betazero/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/betazero"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
