[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "betazero"
version = "0.1.0"
description = "An SFT-only AI twin of a developer, served to coding agents as MCP tools."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: Apache Software License"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Training pulls a heavy CUDA stack; keep it out of the default install so the
# MCP server and the corpus tooling stay cheap to set up.
# Pinned, not floated. An unpinned torch resolved to 2.13.0 on the training
# box, which pulls CUDA-13 wheels in alongside the cu121 ones and breaks
# bitsandbytes on libnvJitLink.so.13. These versions are the stack the L4 the
# adapter was trained on actually runs.
train = [
    "torch==2.8.*",
    "transformers==4.57.6",
    "peft==0.17.*",
    "accelerate==1.10.*",
]
dev = ["ruff>=0.7", "pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/debisoft/betazero"
Issues = "https://github.com/debisoft/betazero/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/betazero"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
